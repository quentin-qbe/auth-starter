spring:
  application:
    name: ${SPRING_APPLICATION_NAME:authstarter}
  liquibase:
    enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${SPRING_DATASOURCE_SCHEMA:authdb}
        format_sql: true
    show-sql: false

app:
  security:
    keys:
      private-key: ${RSA_PRIVATE_KEY}
      public-key: ${RSA_PUBLIC_KEY}
    jwt:
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
      access-token-duration: ${JWT_ACCESS_TOKEN_DURATION}
      refresh-token-duration: ${JWT_REFRESH_TOKEN_DURATION}

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/authstarter}
  error:
    include-message: always
    include-stacktrace: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}