services:

  postgres:
    build:
      context: ../docker/postgres
      dockerfile: Dockerfile
    container_name: ${POSTGRES_CONTAINER_NAME}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  liquibase:
    image: ${LIQUIBASE_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../liquibase/changelog:/liquibase/changelog
      - ../liquibase/liquibase.properties:/liquibase/liquibase.properties
      - ../liquibase/lib:/liquibase/lib
    command:
      - --defaults-file=/liquibase/liquibase.properties
      - --changelog-file=master.yml
      - update

  app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: ${APP_CONTAINER_NAME}
    depends_on:
      liquibase:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_SCHEMA: ${SPRING_DATASOURCE_SCHEMA}
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY}
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_TOKEN_DURATION: ${JWT_ACCESS_TOKEN_DURATION}
      JWT_REFRESH_TOKEN_DURATION: ${JWT_REFRESH_TOKEN_DURATION}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT}
      LOG_LEVEL_SECURITY: ${LOG_LEVEL_SECURITY}
    ports:
      - "${APP_PORT}:8081"
    restart: unless-stopped

volumes:
  postgres_data: