databaseChangeLog:
  - changeSet:
      id: 007-create-table-permissions
      author: qbe
      changes:
        - createTable:
            schemaName: authdb
            tableName: permissions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_permissions
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_permissions_name