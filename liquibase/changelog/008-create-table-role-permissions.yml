databaseChangeLog:
  - changeSet:
      id: 008-create-table-role-permissions
      author: qbe
      changes:
        - createTable:
            schemaName: authdb
            tableName: role_permissions
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: permission_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            schemaName: authdb
            tableName: role_permissions
            columnNames: role_id, permission_id
            constraintName: pk_role_permissions
        - addForeignKeyConstraint:
            baseTableSchemaName: authdb
            baseTableName: role_permissions
            baseColumnNames: role_id
            referencedTableSchemaName: authdb
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_role_permissions_role
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: authdb
            baseTableName: role_permissions
            baseColumnNames: permission_id
            referencedTableSchemaName: authdb
            referencedTableName: permissions
            referencedColumnNames: id
            constraintName: fk_role_permissions_permission
            onDelete: CASCADE