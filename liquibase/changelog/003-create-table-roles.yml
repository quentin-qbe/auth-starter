databaseChangeLog:
  - changeSet:
      id: 003-create-table-roles
      author: qbe
      changes:
        - createTable:
            schemaName: authdb
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_roles
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_roles_name