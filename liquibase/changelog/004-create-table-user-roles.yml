databaseChangeLog:
  - changeSet:
      id: 004-create-table-user-roles
      author: qbe
      changes:
        - createTable:
            schemaName: authdb
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            schemaName: authdb
            tableName: user_roles
            columnNames: user_id, role_id
            constraintName: pk_user_roles
        - addForeignKeyConstraint:
            baseTableSchemaName: authdb
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableSchemaName: authdb
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: authdb
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableSchemaName: authdb
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role
            onDelete: CASCADE